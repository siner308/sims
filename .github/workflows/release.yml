name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          # the tag message says what the release is for. Only the CLI takes a header, and only as a
          # file, so the config cannot carry it: without this the notes are a list of commits and a
          # reader has to infer the point from thirty subject lines.
          args: release --clean --release-header-tmpl .github/release-header.md.tmpl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
