version: 2

project_name: sims

before:
  hooks:
    - go mod tidy

builds:
  - id: sims
    main: ./cmd/sims
    binary: sims
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
  # the tag message says what the release is for; without this the notes are a list of commits and
  # a reader has to infer it from thirty subject lines. The body leaves out the subject, which is
  # the version and is already the title of the release.
  header: |
    {{ .TagBody }}

